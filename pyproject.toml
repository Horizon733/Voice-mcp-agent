[project]
name = "talk-to-your-tools"
version = "0.1.0"
description = "Voice-first agentic AI workshop demo with Gemini and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "RealtimeSTT==0.3.104",
  "google-genai==1.28.0",
  "mcp==1.10.1",
  "fastmcp==0.3.0",
  "transformers==4.47.1",
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "qwen-tts",
  "sounddevice==0.5.1",
  "numpy==2.1.3",
  "httpx==0.28.1",
  "aiosqlite==0.20.0",
  "python-dotenv==1.0.1",
  "rich==13.9.4",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
  { index = "pytorch-cu121", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
